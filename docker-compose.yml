version: '3.8'

services:
  agent-hq-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agent_hq_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/office.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    volumes:
      - ./server/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-hq-network

  agent-hq-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agent_hq_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - agent-hq-server
    environment:
      - NODE_ENV=production
    networks:
      - agent-hq-network

networks:
  agent-hq-network:
    driver: bridge
